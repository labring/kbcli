name: Release Create

on:
  push:
    tags:
      - 'v*'
      - '!*cloud'

permissions:
  contents: write

jobs:
  release-create:
    if: ${{ github.repository == 'apecloud/kbcli' && ! contains(github.ref_name, 'v0.5.') && ! contains(github.ref_name, 'v0.6.') && ! contains(github.ref_name, 'v0.7.') }}
    uses: apecloud/apecloud-cd/.github/workflows/release-create.yml@v0.1.42
    with:
      APECD_REF: "v0.1.42"
    secrets: inherit

  release-create-fork:
    if: ${{ github.repository != 'apecloud/kbcli' && ! contains(github.ref_name, 'v0.5.') && ! contains(github.ref_name, 'v0.6.') && ! contains(github.ref_name, 'v0.7.') }}
    name: Create fork GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create fork release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          name: ${{ github.event.repository.name }} ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: true

  release-kbcli-fork:
    if: ${{ !failure() && !cancelled() && needs.release-create-fork.result == 'success' }}
    needs: [ release-create-fork ]
    uses: ./.github/workflows/release-kbcli.yml
    secrets: inherit
