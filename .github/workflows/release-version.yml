name: Release Version

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'The GitHub release tag, such as v0.9.7-labring.1'
        required: true
        type: string

run-name: ref_name:${{ github.ref_name }} release_version:${{ inputs.release_version }}

permissions:
  contents: write
  pull-requests: write

jobs:
  resolve-release-version:
    runs-on: ubuntu-latest
    outputs:
      release-version: ${{ steps.version.outputs.release-version }}
    steps:
      - name: Resolve release version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ ! "${RELEASE_VERSION}" =~ ^v[0-9]+ ]]; then
            echo "release_version must be an explicit tag such as v0.9.7-labring.1." >&2
            exit 1
          fi
          echo "release-version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  release-tag:
    needs: [ resolve-release-version ]
    uses: ./.github/workflows/release-tag.yaml
    with:
      VERSION: "${{ needs.resolve-release-version.outputs.release-version }}"
    secrets: inherit

  # Tag operations performed with GITHUB_TOKEN do not trigger another workflow.
  # Build the GitHub release directly after the reusable tag job completes.
  release-kbcli:
    needs: [ resolve-release-version, release-tag ]
    uses: ./.github/workflows/release-kbcli.yml
    with:
      TAG_NAME: "${{ needs.resolve-release-version.outputs.release-version }}"
    secrets: inherit
